services:
  - type: web
    name: caliber-knowledge-hub
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: GROQ_API_KEY
        sync: false
      - key: CALIBER_ALLOW_GROQ_PROCESSING
        value: true
